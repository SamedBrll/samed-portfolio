<template id="services"><article class="article sales-content"><div class="eyebrow">HİZMETLER / FİKRİNDEN ÇALIŞAN ÜRÜNE</div><h2>İşini kolaylaştıran<br>yazılımlar.</h2><p>Telegram’da müşterilerinle iletişim kurmak, tekrarlanan işleri azaltmak veya bir fikri uygulamaya dönüştürmek için.</p><div class="service-list"><section><span>01 / TELEGRAM BOTU</span><h3>Grubun ve iş akışların tek yerden yönetilsin.</h3><p>Karşılama, destek talepleri, moderasyon, duyuru ve yönetim paneli bağlantıları.</p><button data-app="demo" class="text-button">Örnek botu dene ↗</button></section><section><span>02 / MİNİ UYGULAMA</span><h3>Ürünün Telegram’ın içinde açılsın.</h3><p>Etkileşimli ekranlar, kullanıcı oturumu, veri kaydı ve arka uç bağlantıları.</p><button data-project="2" class="text-button">Dragon Empire dosyası ↗</button></section><section><span>03 / OTOMASYON & PANEL</span><h3>Tekrarlanan işleri yazılıma devret.</h3><p>Kayıt, randevu, raporlama ve ekip içi işlemleri ihtiyacına göre bir araya getiren araçlar.</p><button data-project="3" class="text-button">Kayıt sistemi dosyası ↗</button></section></div><h3>Birlikte nasıl çalışırız?</h3><ol class="process-list"><li><strong>İhtiyacı netleştiririz.</strong> Kim kullanacak, hangi sorunu çözecek?</li><li><strong>Kapsamı belirleriz.</strong> İlk sürüm, teslim planı ve teklif netleşir.</li><li><strong>Çalışan sürümü deneriz.</strong> Akışları birlikte değerlendirip iyileştiririz.</li></ol><details><summary>Fiyat ve teslim süresi nedir?</summary><p>Entegrasyonlara, ekranlara ve iş akışına bağlı. Kısa bir proje özetiyle başlayıp kapsam üzerinden netleştirelim.</p></details><details><summary>Mevcut sistemime bağlanabilir mi?</summary><p>Kullandığın araçları ve erişim imkânlarını inceleyerek uygun bağlantıları belirleyebiliriz.</p></details><button class="primary" data-app="brief">Projemi anlatayım <span>↗</span></button></article></template>

ss="copy-status" role="status"></p><p class="form-note">Mesaj henüz gönderilmedi. Telegram taslağı veya e-posta uygulaması açılmazsa metni kopyalayıp <a href="https://t.me/samedbrll" target="_blank" rel="noopener noreferrer">@samedbrll</a> ya da <a href="mailto:subzeroreiz@gmail.com">subzeroreiz@gmail.com</a> üzerinden iletebilirsin.</p></section></article></template>
